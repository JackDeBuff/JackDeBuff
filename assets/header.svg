<svg viewBox="0 0 860 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0D1117; stroke: rgba(0,230,118,0.4); stroke-width: 1; }
    .bar { stroke: rgba(0,230,118,0.18); stroke-width: 1; }
    .title { font: 12px 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #8B949E; }
    .mono { font: 600 16px 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .prompt { fill: #00E676; }
    .cmd { fill: #E6EDF3; }
    .out { fill: #9BA9B4; }
    .hl { fill: #00E676; }
    .type { clip-path: inset(-10% 100% -10% 0); animation: type 1s steps(24) forwards; }
    .t1 { animation-delay: 0.4s; }
    .t2 { animation-delay: 2.6s; animation-duration: 1.3s; }
    .o1 { opacity: 0; animation: fade 0.45s ease 1.7s forwards; }
    .o2 { opacity: 0; animation: fade 0.45s ease 4.2s forwards; }
    .p3 { opacity: 0; animation: fade 0.2s ease 5.0s forwards; }
    .cursor { opacity: 0; animation: fade 0.1s ease 5.2s forwards, blink 1.1s steps(1) 5.2s infinite; fill: #00E676; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes type { to { clip-path: inset(-10% -2% -10% 0); } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  </style>

  <rect class="bg" x="10" y="10" width="840" height="230" rx="16"/>
  <line class="bar" x1="10" y1="58" x2="850" y2="58"/>

  <circle cx="38" cy="34" r="6.5" fill="#FF5F56"/>
  <circle cx="60" cy="34" r="6.5" fill="#FFBD2E"/>
  <circle cx="82" cy="34" r="6.5" fill="#27C93F"/>

  <text class="title" x="430" y="39" text-anchor="middle">jack@debuff: ~/duke — zsh</text>
  <g class="pulse">
    <circle cx="806" cy="34" r="4" fill="#00E676"/>
    <text class="title" x="796" y="39" text-anchor="end" fill="#00E676">online</text>
  </g>

  <g class="mono">
    <text x="38" y="100"><tspan class="prompt">$ </tspan><tspan class="cmd type t1">whoami</tspan></text>
    <text x="38" y="132" class="o1"><tspan class="hl">Jack</tspan><tspan class="out"> · Data Scientist · Machine Learning @ </tspan><tspan class="cmd">Duke University</tspan></text>
    <text x="38" y="164"><tspan class="prompt">$ </tspan><tspan class="cmd type t2">cat interests.txt</tspan></text>
    <text x="38" y="196" class="o2"><tspan class="out">GenAI · AI Agents · Geospatial ML · Computer Vision · FinTech</tspan></text>
    <text x="38" y="226" class="p3"><tspan class="prompt">$</tspan></text>
    <rect class="cursor" x="60" y="212" width="10" height="18"/>
  </g>
</svg>
